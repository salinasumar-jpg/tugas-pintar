<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TodoList Simple</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033} .wrap{max-width:720px;margin:0 auto;padding:48px 20px}.card{background:#fff;border:1px solid #e6e9f0;border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(20,30,50,.08)} h1{margin:0 0 6px;font-size:32px}.sub{margin:0 0 24px;color:#6b7280}.form{display:flex;gap:10px}.form input{flex:1;padding:13px 15px;border:1px solid #d9deea;border-radius:12px;font-size:16px;outline:none}.form input:focus{border-color:#6b7280}.btn{border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer;background:#172033;color:white}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 14px}.filters{display:flex;gap:6px}.filter{border:1px solid #e1e5ed;background:#fff;padding:7px 11px;border-radius:9px;cursor:pointer}.filter.active{background:#172033;color:#fff}.count{color:#6b7280;font-size:14px}.list{list-style:none;padding:0;margin:0}.item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid #edf0f5}.item:first-child{border-top:0}.check{width:20px;height:20px;cursor:pointer}.text{flex:1;word-break:break-word}.done{text-decoration:line-through;color:#9aa2b1}.delete{border:0;background:transparent;color:#9aa2b1;cursor:pointer;font-size:18px}.empty{text-align:center;color:#8a93a3;padding:30px 0}.footer{display:flex;justify-content:flex-end;margin-top:14px}.clear{border:0;background:transparent;color:#6b7280;cursor:pointer;font-size:14px}@media(max-width:520px){.wrap{padding:24px 12px}.card{padding:20px}.form{flex-direction:column}.btn{height:46px}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>TodoList</h1>
      <p class="sub">Senarai tugas simple untuk hari ini.</p>
      <form class="form" id="form">
        <input id="input" type="text" placeholder="Contoh: Siapkan kerja sekolah" autocomplete="off" />
        <button class="btn" type="submit">Tambah</button>
      </form>
      <div class="toolbar">
        <div class="filters" id="filters">
          <button class="filter active" data-filter="all">Semua</button>
          <button class="filter" data-filter="active">Belum siap</button>
          <button class="filter" data-filter="done">Siap</button>
        </div>
        <span class="count" id="count"></span>
      </div>
      <ul class="list" id="list"></ul>
      <div class="footer"><button class="clear" id="clear">Padam yang siap</button></div>
    </section>
  </main>
  <script>
    const KEY='todolist-simple-v1';
    let todos=JSON.parse(localStorage.getItem(KEY)||'[]');
    let filter='all';
    const form=document.querySelector('#form'), input=document.querySelector('#input'), list=document.querySelector('#list'), count=document.querySelector('#count');
    function save(){localStorage.setItem(KEY,JSON.stringify(todos));render()}
    function render(){
      const visible=todos.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));
      list.innerHTML=visible.length?visible.map(t=>`<li class="item"><input class="check" type="checkbox" data-id="${t.id}" ${t.done?'checked':''}><span class="text ${t.done?'done':''}">${escapeHtml(t.text)}</span><button class="delete" data-delete="${t.id}" aria-label="Padam">×</button></li>`).join(''):`<li class="empty">Tiada tugasan di sini ✨</li>`;
      const left=todos.filter(t=>!t.done).length; count.textContent=`${left} tugas belum siap`;
      document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
    }
    function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;todos.unshift({id:Date.now(),text,done:false});input.value='';save();input.focus()});
    list.addEventListener('click',e=>{const id=Number(e.target.dataset.delete);if(id){todos=todos.filter(t=>t.id!==id);save()}});
    list.addEventListener('change',e=>{const id=Number(e.target.dataset.id);if(id){const t=todos.find(x=>x.id===id);if(t)t.done=e.target.checked;save()}});
    document.querySelector('#filters').addEventListener('click',e=>{if(e.target.dataset.filter){filter=e.target.dataset.filter;render()}});
    document.querySelector('#clear').addEventListener('click',()=>{todos=todos.filter(t=>!t.done);save()});
    render();
  </script>
</body>
</html>
