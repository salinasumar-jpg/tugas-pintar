<!doctype html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TodoList Booking</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f6fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:32px 18px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:20px;padding:24px;box-shadow:0 10px 30px #18243a12}h1{margin:0 0 5px}.muted{color:#697386;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:700}.field input,.field select{padding:11px;border:1px solid #d7dce6;border-radius:10px;font-size:15px}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:12px 18px;background:#172033;color:#fff;font-weight:700;cursor:pointer}.actions{margin-top:15px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.stat{background:#f4f6fb;padding:10px 14px;border-radius:10px}.booking{border-top:1px solid #edf0f4;padding:16px 0;display:grid;grid-template-columns:1fr auto;gap:8px}.booking h3{margin:0}.booking p{margin:4px 0;color:#697386}.del{border:1px solid #ddd;background:white;border-radius:8px;padding:8px;cursor:pointer}.empty{text-align:center;color:#8a93a3;padding:30px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.booking{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>TodoList Booking</h1><p class="muted">Urus tugasan dan tempahan pelanggan dalam satu aplikasi.</p><form id="form" class="grid"><div class="field"><label>Nama pelanggan</label><input id="name" required placeholder="Contoh: Ali"></div><div class="field"><label>Tarikh</label><input id="date" type="date" required></div><div class="field"><label>Masa</label><input id="time" type="time" required></div><div class="field"><label>Jenis booking</label><select id="type"><option>Meeting</option><option>Servis</option><option>Consultation</option><option>Event</option></select></div><div class="field full"><label>Nota</label><input id="note" placeholder="Catatan tambahan (optional)"></div><div class="actions full"><button class="btn">+ Tambah Booking</button></div></form><div class="stats"><div class="stat"><b id="total">0</b> jumlah</div><div class="stat"><b id="today">0</b> hari ini</div></div><div id="list"></div></section></main><script>const K='booking-v1';let data=JSON.parse(localStorage.getItem(K)||'[]');const $=id=>document.getElementById(id);function save(){localStorage.setItem(K,JSON.stringify(data));render()}function render(){const today=new Date().toISOString().slice(0,10);$('total').textContent=data.length;$('today').textContent=data.filter(x=>x.date===today).length;if(!data.length){$('list').innerHTML='<div class="empty">Belum ada booking.</div>';return}data.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('list').innerHTML=data.map(x=>`<article class="booking"><div><h3>${esc(x.name)} · ${esc(x.type)}</h3><p>📅 ${esc(x.date)} &nbsp; 🕐 ${esc(x.time)}</p>${x.note?`<p>📝 ${esc(x.note)}</p>`:''}</div><button class="del" data-id="${x.id}">Padam</button></article>`).join('')}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}$('form').onsubmit=e=>{e.preventDefault();data.push({id:Date.now(),name:$('name').value.trim(),date:$('date').value,time:$('time').value,type:$('type').value,note:$('note').value.trim()});e.target.reset();save()};$('list').onclick=e=>{if(e.target.dataset.id){data=data.filter(x=>x.id!=e.target.dataset.id);save()}};render();</script></body></html>
