<!doctype html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookingDesk | Corporate</title><style>:root{--navy:#122033;--blue:#2563eb;--bg:#f5f7fa;--line:#e5e9ef;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#172033}.side{position:fixed;inset:0 auto 0 0;width:225px;background:var(--navy);color:white;padding:26px 18px}.brand{font-size:20px;font-weight:800;padding:0 10px 28px}.brand span{color:#93c5fd}.nav{display:grid;gap:6px}.nav a{color:#cbd5e1;text-decoration:none;padding:11px 12px;border-radius:8px}.nav a.active,.nav a:hover{background:#22334b;color:white}.main{margin-left:225px;padding:32px 38px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--muted)}h1{margin:5px 0;font-size:28px}.sub{margin:0;color:var(--muted)}.profile{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-weight:800}.dashboard{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.stat,.card{background:white;border:1px solid var(--line);border-radius:14px}.stat{padding:20px}.stat small{color:var(--muted);font-weight:600}.stat strong{display:block;font-size:28px;margin-top:7px}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{padding:22px}.card h2{font-size:17px;margin:0 0 18px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:750;color:#374151}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #d7dde6;border-radius:8px;background:white;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:8px;padding:12px;background:var(--blue);color:white;font-weight:750;cursor:pointer}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.search{padding:9px 11px;border:1px solid var(--line);border-radius:8px;width:210px}.booking{display:grid;grid-template-columns:1fr auto;gap:15px;padding:17px 0;border-top:1px solid var(--line)}.booking:first-child{border-top:0}.booking h3{margin:0;font-size:15px}.meta,.note{color:var(--muted);font-size:13px;margin:5px 0}.badge{font-size:11px;font-weight:750;padding:4px 8px;border-radius:999px;background:#ecfdf5;color:#047857}.del{border:1px solid var(--line);background:white;color:#6b7280;border-radius:7px;padding:7px 10px;cursor:pointer}.empty{text-align:center;padding:40px;color:#9ca3af}@media(max-width:900px){.side{display:none}.main{margin:0;padding:24px 16px}.layout{grid-template-columns:1fr}}@media(max-width:600px){.profile{display:none}.dashboard{grid-template-columns:1fr}.row{grid-template-columns:1fr}.toolbar{align-items:flex-start;gap:10px;flex-direction:column}.search{width:100%}}</style></head><body><aside class="side"><div class="brand">Booking<span>Desk</span></div><nav class="nav"><a class="active" href="#dashboard">Dashboard</a><a href="#booking">Bookings</a><a href="#new">New Booking</a></nav></aside><main class="main"><header class="top"><div><div class="eyebrow">Operations</div><h1>Booking Dashboard</h1><p class="sub">Urus tempahan pelanggan dengan lebih teratur.</p></div><div class="profile"><div><b>Administrator</b><br><span style="font-size:12px;color:#6b7280">Booking Management</span></div><div class="avatar">A</div></div></header><section class="dashboard" id="dashboard"><div class="stat"><small>Total Bookings</small><strong id="total">0</strong></div><div class="stat"><small>Today</small><strong id="today">0</strong></div><div class="stat"><small>Upcoming</small><strong id="upcoming">0</strong></div></section><div class="layout"><section class="card" id="new"><h2>New Booking</h2><form id="form"><div class="field"><label>Customer Name</label><input id="name" required placeholder="Customer name"></div><div class="row"><div class="field"><label>Date</label><input id="date" type="date" required></div><div class="field"><label>Time</label><input id="time" type="time" required></div></div><div class="field"><label>Booking Type</label><select id="type"><option>Meeting</option><option>Consultation</option><option>Service</option><option>Event</option></select></div><div class="field"><label>Notes</label><input id="note" placeholder="Optional notes"></div><button class="btn">Create Booking</button></form></section><section class="card" id="booking"><div class="toolbar"><div><h2 style="margin:0">Recent Bookings</h2><span style="font-size:12px;color:#9ca3af">Latest customer appointments</span></div><input class="search" id="search" placeholder="Search customer..."></div><div id="list"></div></section></div></main><script>const K='booking-corporate-v1';let data=JSON.parse(localStorage.getItem(K)||'[]');const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function save(){localStorage.setItem(K,JSON.stringify(data));render()}function render(){let q=$('search').value.toLowerCase(),today=new Date().toISOString().slice(0,10);$('total').textContent=data.length;$('today').textContent=data.filter(x=>x.date===today).length;$('upcoming').textContent=data.filter(x=>new Date(x.date+'T'+x.time)>=new Date()).length;let arr=data.filter(x=>x.name.toLowerCase().includes(q)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('list').innerHTML=arr.length?arr.map(x=>'<article class="booking"><div><h3>'+esc(x.name)+' <span class="badge">Confirmed</span></h3><div class="meta">'+esc(x.date)+' · '+esc(x.time)+' · '+esc(x.type)+'</div>'+(x.note?'<div class="note">'+esc(x.note)+'</div>':'')+'</div><button class="del" data-id="'+x.id+'">Delete</button></article>').join(''):'<div class="empty">No bookings found.</div>'}$('form').onsubmit=e=>{e.preventDefault();data.push({id:Date.now(),name:$('name').value.trim(),date:$('date').value,time:$('time').value,type:$('type').value,note:$('note').value.trim()});e.target.reset();save()};$('list').onclick=e=>{if(e.target.dataset.id){data=data.filter(x=>x.id!=e.target.dataset.id);save()}};$('search').oninput=render;render();</script></body></html>
